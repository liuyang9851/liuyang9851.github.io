<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; line-height: 1.6; color: #333; }
        h1 { color: #0366d6; }
        a { color: #0366d6; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .container { text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>你好，我是 [你的名字]</h1>
        <p>这是我用 GitHub Pages 搭建的个人主页。</p>
        <p>我平时喜欢 [你的爱好，比如：阅读、编程、看电影]。</p>
        <h2>关于我</h2>
        <ul style="list-style: none; padding: 0;">
            <li>📚 学校/公司：[你的学校或公司]</li>
            <li>📧 邮箱：[你的邮箱]</li>
            <li>🐙 GitHub：<a href="https://github.com/你的用户名">@你的用户名</a></li>
        </ul>
    </div>
</body>
</html>
